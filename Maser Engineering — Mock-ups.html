V.client=()=>{const p=PM.p1,g=prog('p1'),ms=MS.filter(m=>m.p=='p1').sort((a,b)=>a.d.localeCompare(b.d)),am=A.filter(a=>a.p=='p1'&&a.s!='Draft');return`<div style="max-width:1152px;margin:auto;width:100%" class=col>${ph('Client Space','Preview of what Marc Fontaine (Helios Energy) sees. Internal tasks, tests and notes stay hidden.','Helios Energy')}<div class="c col" style="gap:20px;padding:24px"><div class=row style="align-items:flex-start"><div><p class="mono mf sm">${p.code}</p><h2 style="font-size:20px;margin:4px 0">${p.name}</h2><p class=mf style="max-width:560px">${p.desc}</p></div><span class=ml>${bd(p.stat,SC[p.stat])}</span></div><div><div class=row style="justify-content:space-between;margin-bottom:8px"><span class=mf>Overall progress</span><b class=mono style="font-size:24px">${g}%</b></div><div class=pb style="height:10px"><i style="width:${g}%;background:var(--pri)"></i></div><div class="row mf sm" style="justify-content:space-between;margin-top:8px"><span>Started ${fd(p.start)}</span><span>Target ${fd(p.end)}</span></div></div></div><div class="g2 sp" style="grid-template-columns:1fr 320px"><div class=col style="gap:24px"><div class="c col"><h3>Key milestones</h3><ol class=tl>${ms.map(m=>`<li class="${m.d<TODAY?'d':''}"><p style="font-weight:500;${m.d<TODAY?'color:var(--mf);text-decoration:line-through':''}">${m.t}</p><p class="mf sm">${fd(m.d,{weekday:'short',day:'numeric',month:'long',year:'numeric'})}</p></li>`).join('')}</ol></div><div class=col style="gap:12px"><h3>Meetings</h3>${mMeet('p1',1)}</div><div class=col style="gap:12px"><h3>Messages</h3>${mNotes('p1',1)}</div></div><div class=col><div class="c z"><div class=ch>Your contacts</div><ul class=dv><li>${av('u2',32)}<div class=m><p><b style="font-weight:500">${M.u2[0]}</b></p><p class="mf sm">${M.u2[3]}</p></div></li></ul></div><div class="c z"><div class=ch>Contract amendments</div><ul class=dv>${am.map(a=>`<li style="flex-direction:column;align-items:stretch;gap:6px"><div class=row><span class="mono sm">▤ ${a.ref}</span><span class=ml>${bd(a.s,AC[a.s])}</span></div><b style="font-weight:500">${a.t}</b><span class="mf sm">${a.amt?'+'+eur(a.amt):'No budget impact'}${a.days?' · +'+a.days+' days':''}</span></li>`).join('')}</ul></div></div></div></div>`};
const NAV=[['dash','Dashboard','▦'],['projects','Projects','▤'],['tasks','Tasks','☑'],['tests','Tests','⚗'],['gantt','Gantt Chart','▬'],['notes','Notes','✎'],['amend','Amendments','±','Avenants'],['meet','Meetings','◷','Réunions']],nv=(k,l,i,h,on)=>`<div class="nv ${on?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}${h?`<em>${h}</em>`:''}</div>`;
function draw(){const cur=S.s=='detail'?'projects':S.s;$.innerHTML=`<aside><div class=lg><i>M</i><div><b>Maser</b><small>Engineering</small></div></div><button class=btn>＋ New Project</button><p class=l>Workspace</p>${NAV.map(n=>nv(n[0],n[1],n[2],n[3],cur==n[0])).join('')}<p class=l style="margin-top:16px">External</p>${nv('client','Client Space','⌂','',cur=='client')}<div class=pm style="margin-top:auto"><b>Prototype mode</b>Switch roles from the profile menu to preview Admin, Manager, Collaborator and Client views.</div></aside><div class=mn><header class=top><input class=in placeholder="Search projects, tasks, clients..."><div class=r><span class=bell>🔔<b>3</b></span><span class=row style="gap:10px">${av(ME,32)}<span style="line-height:1.2"><b style="font-weight:500">${M[ME][0]}</b><br><span class="mf sm">${M[ME][3]}</span></span>${bd(M[ME][2],'g',0)}</span></div></header><main class=pad><div class=wrap>${V[S.s]()}</div></main></div>`}
function go(s,pid,tab){S.s=s;if(pid)S.pid=pid;S.tab=tab||'overview';draw();scrollTo(0,0)}
draw();
</script></body></html>

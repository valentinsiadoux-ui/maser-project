/* ============================================================
   Palette Maser Engineering (reprise du fichier Mock-ups.html)
   Clair / sombre via light-dark(), suit le thème du système.
   ============================================================ */
:root {
  color-scheme: light dark;
  --spacing: 0.25rem;

  --background: light-dark(#f6f6f6, #1c1b1b);
  --foreground: light-dark(#2b2929, #f6f6f6);
  --card: light-dark(#ffffff, #272525);
  --card-foreground: var(--foreground);
  --popover: var(--card);
  --popover-foreground: var(--foreground);

  --primary: #e63641;
  --primary-foreground: #ffffff;

  --alt: light-dark(#4f4c4d, #b5b2b3);
  --secondary: light-dark(#f6f6f6, #333031);
  --secondary-foreground: var(--alt);
  --muted: light-dark(#f6f6f6, #333031);
  --muted-foreground: light-dark(#6f6c6d, #aaa7a8);
  --accent: light-dark(#f6f6f6, #333031);
  --accent-foreground: var(--foreground);

  --success: oklch(0.6 0.13 163);
  --success-foreground: #ffffff;
  --warning: oklch(0.75 0.15 70);
  --warning-foreground: color-mix(in oklch, var(--warning) 65%, var(--foreground));
  --destructive: oklch(0.58 0.22 27);

  --border: light-dark(#e6e5e5, #3d3a3b);
  --input: light-dark(#e6e5e5, #3d3a3b);
  --ring: #e63641;

  --chart-1: #e63641;
  --chart-2: oklch(0.6 0.13 163);
  --chart-3: oklch(0.75 0.15 70);
  --chart-4: oklch(0.58 0.22 27);
  --chart-5: oklch(0.6 0.1 240);

  /* textes de badges / pastilles : teinte mélangée au texte (comme le mock-up) */
  --alt-ink: color-mix(in oklch, var(--alt) 65%, var(--foreground));
  --success-ink: color-mix(in oklch, var(--success) 65%, var(--foreground));
  --warning-ink: color-mix(in oklch, var(--warning) 65%, var(--foreground));
  --destructive-ink: color-mix(in oklch, var(--destructive) 65%, var(--foreground));
  --chart-5-ink: color-mix(in oklch, var(--chart-5) 65%, var(--foreground));
  --muted-ink: color-mix(in oklch, var(--muted-foreground) 65%, var(--foreground));

  --sidebar: #4f4c4d;
  --sidebar-foreground: #f6f6f6;
  --sidebar-primary: #e63641;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #625f60;
  --sidebar-accent-foreground: #ffffff;
  --sidebar-border: #625f60;
  --sidebar-ring: #e63641;

  --radius: 0.5rem;
  --radius-sm: calc(var(--radius) * 0.6);
  --radius-md: calc(var(--radius) * 0.8);
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) * 1.4);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

/* animations (équivalent minimal de tw-animate-css) */
@keyframes enter { from { opacity: var(--tw-enter-opacity, 1); transform: scale(var(--tw-enter-scale, 1)); } }
.animate-in { animation: enter 150ms ease-out; }
.animate-out { animation: none; }
.fade-in-0 { --tw-enter-opacity: 0; }
.zoom-in-95 { --tw-enter-scale: .95; }

/* le dialogue est centré par translate : on conserve la translation pendant le zoom */
[data-slot="dialog-content"].animate-in { animation: dlg-in 120ms ease-out; }
@keyframes dlg-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.95); } }

.field-sizing-content { field-sizing: content; }

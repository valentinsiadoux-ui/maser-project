<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f4c4d">
  <title>Sign in · Maser Engineering</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e63641'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' font-weight='700' text-anchor='middle' fill='white'%3EM%3C/text%3E%3C/svg%3E">

  <!-- Polices : à supprimer si elles sont déjà chargées par main.css (par ex. via @fontsource) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Préférences d'affichage (thème, palette, taille) : appliquées avant le premier rendu, pour éviter un flash -->
  <script>
    try {
      var p = JSON.parse(localStorage.getItem('maser-prefs-v1') || '{}'), e = document.documentElement;
      if (p.theme && p.theme !== 'system') e.setAttribute('data-theme', p.theme);
      if (p.palette && p.palette !== 'maser') e.setAttribute('data-palette', p.palette);
      if (p.density && p.density !== 'comfortable') e.setAttribute('data-density', p.density);
    } catch (_) {}
  </script>

  <!-- Page autonome : charge main.css (Tailwind, FlyonUI, tokens), login.css, Alpine et les données de test -->
  <script type="module">
    import './main.css';
    import './login.css';
    import Alpine from 'alpinejs';
    import { registerLogin } from './loginData.js';
    // import 'flyonui/flyonui';   // composants JS de FlyonUI : inutile ici (aucun composant interactif FlyonUI)

    window.Alpine = Alpine;
    registerLogin(Alpine);          // store « login » + composant x-data « login »
    Alpine.start();
  </script>
</head>

<body x-data="login" class="login-page">
  <div class="grid min-h-dvh bg-background text-foreground lg:grid-cols-[minmax(0,1.05fr)_minmax(0,1fr)]">

    <!-- ============ Panneau de marque ============ -->
    <aside class="relative hidden flex-col justify-between overflow-hidden bg-sidebar p-12 text-sidebar-foreground lg:flex">
      <div class="flex items-center gap-2.5">
        <span aria-hidden="true" class="grid size-9 place-items-center rounded-md bg-sidebar-primary font-mono text-base font-bold text-sidebar-primary-foreground">M</span>
        <span class="flex flex-col leading-none">
          <span class="text-base font-semibold tracking-tight text-sidebar-accent-foreground">Maser</span>
          <span class="mt-0.5 text-[10px] font-medium tracking-[0.18em] text-sidebar-foreground/60 uppercase">Engineering</span>
        </span>
      </div>

      <div class="relative z-10 max-w-md">
        <p class="font-mono text-xs tracking-[0.18em] text-sidebar-foreground/60 uppercase" x-text="$store.login.brand.eyebrow"></p>
        <h2 class="mt-4 text-4xl leading-tight font-semibold tracking-tight text-sidebar-accent-foreground" x-text="$store.login.brand.title"></h2>
        <p class="mt-4 text-sm leading-relaxed text-sidebar-foreground/70" x-text="$store.login.brand.text"></p>
        <ul class="mt-8 flex flex-col gap-3 text-sm text-sidebar-foreground/80">
          <template x-for="feature in $store.login.brand.features" :key="feature">
            <li class="flex items-center gap-2.5"><span aria-hidden="true" class="size-1.5 rounded-full bg-sidebar-primary"></span><span x-text="feature"></span></li>
          </template>
        </ul>
      </div>

      <p class="relative z-10 text-xs text-sidebar-foreground/50" x-text="copyright"></p>

      <!-- Décor : quadrillage technique + halo d'accent -->
      <div aria-hidden="true" class="login-grid pointer-events-none absolute inset-0 opacity-[0.07]"></div>
      <div aria-hidden="true" class="pointer-events-none absolute -right-24 -bottom-24 size-80 rounded-full bg-sidebar-primary/20 blur-3xl"></div>
    </aside>

    <!-- ============ Formulaire ============ -->
    <main class="flex items-center justify-center px-6 py-12">
      <div class="w-full max-w-sm">

        <!-- Logo (mobile uniquement) -->
        <div class="mb-8 flex items-center gap-2.5 lg:hidden">
          <span aria-hidden="true" class="grid size-9 place-items-center rounded-md bg-primary font-mono text-base font-bold text-primary-foreground">M</span>
          <span class="flex flex-col leading-none">
            <span class="text-base font-semibold tracking-tight">Maser</span>
            <span class="mt-0.5 text-[10px] font-medium tracking-[0.18em] text-muted-foreground uppercase">Engineering</span>
          </span>
        </div>

        <h1 class="text-2xl font-semibold tracking-tight">Welcome back</h1>
        <p class="mt-1.5 text-sm text-muted-foreground">Sign in to access your projects.</p>

        <form class="mt-8 flex flex-col gap-4" novalidate @submit.prevent="enter()">

          <!-- Email -->
          <div class="flex flex-col gap-1.5">
            <label for="login-email" class="label-text">Email</label>
            <div class="relative">
              <svg aria-hidden="true" class="pointer-events-none absolute top-1/2 left-2.5 size-4 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input id="login-email" type="email" autocomplete="email" placeholder="name@maser-engineering.com"
                     x-model="email" class="input pl-9">
            </div>
          </div>

          <!-- Mot de passe -->
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <label for="login-password" class="label-text">Password</label>
              <a href="#" @click.prevent class="link link-primary link-hover text-xs font-medium">Forgot password?</a>
            </div>
            <div class="relative">
              <svg aria-hidden="true" class="pointer-events-none absolute top-1/2 left-2.5 size-4 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="login-password" :type="showPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="••••••••"
                     x-model="password" class="input pr-10 pl-9">
              <button type="button" @click="showPassword = !showPassword"
                      :aria-label="showPassword ? 'Hide password' : 'Show password'"
                      class="absolute top-1/2 right-1.5 grid size-7 -translate-y-1/2 cursor-pointer place-items-center rounded-md text-muted-foreground outline-none hover:bg-card hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring">
                <!-- œil -->
                <svg x-show="!showPassword" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                <!-- œil barré -->
                <svg x-show="showPassword" x-cloak class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
          </div>

          <p x-show="error" x-cloak role="alert" class="rounded-lg border border-destructive/30 bg-destructive/10 px-3 py-2 text-sm text-destructive" x-text="error"></p>

          <label class="flex cursor-pointer items-center gap-2 text-sm text-muted-foreground select-none">
            <input type="checkbox" x-model="remember" class="checkbox checkbox-primary">
            Keep me signed in
          </label>

          <button type="submit" class="btn btn-primary btn-lg btn-block mt-2">Sign in</button>

          <div class="divider my-1" role="separator"><span>or</span></div>

          <button type="button" class="btn btn-outline btn-lg btn-block" @click="enter()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
            Continue with SSO
          </button>
        </form>

        <p class="mt-8 text-center text-xs text-muted-foreground" x-text="$store.login.help"></p>
      </div>
    </main>
  </div>
</body>
</html>
